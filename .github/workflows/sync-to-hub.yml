name: Sync to Hugging Face Hub

on:
  push:
    branches: [main] # Despliega en cada push a main
  workflow_dispatch: # Permite relanzar el deploy a mano desde la pestaña Actions

jobs:
  sync:
    runs-on: ubuntu-latest # VM que solo copia archivos a HF; la imagen Docker la construye Hugging Face
    steps:
      - uses: actions/checkout@v6

      - uses: huggingface/hub-sync@v0.3.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: srada3001/optimizador-balance
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: space
          space_sdk: docker # Sin esto la acción crearía el Space como Gradio
          exclude: |
            .claude/**
            .devcontainer/**
            .vscode/**
            tools/**
